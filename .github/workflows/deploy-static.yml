name: Deploy Static Site via AWS CDK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # On main, deploy only after every test layer has passed
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    # GitHub lists the site under Deployments; a pull request dry run gets no environment
    environment:
      name: ${{ github.event_name == 'push' && 'production - static' || '' }}
      url: ${{ steps.site.outputs.url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      - name: Install CDK Dependencies
        run: cd cdk && npm ci

      - name: Test CDK Stacks
        run: cd cdk && npm test

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Validate CDK Template (Pull Request Dry-run)
        if: github.event_name == 'pull_request'
        run: cd cdk && npx cdk synth

      - name: Deploy Infrastructure (Merged Main Execution)
        if: github.event_name == 'push'
        run: cd cdk && npx cdk deploy CdkStack --require-approval never --outputs-file cdk-outputs.json

      - name: Smoke Test Deployed Site
        id: site
        if: github.event_name == 'push'
        run: |
          URL=$(jq -r '.[].SiteUrl' cdk/cdk-outputs.json)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/"
          curl -fsS "$URL/" | grep -q "<title>Quiz Drill</title>"
